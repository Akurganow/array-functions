name: Publish

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing (OIDC)

# One publish at a time, whatever the tag, so an older version can never finish after a newer one and move the
# `latest` dist-tag backwards. The Release workflow is serialised as well and pushes one tag per run.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes are generated from the commits between the previous tag and this one.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (bundled with Node.js >= 22.14); fail loudly if the pinned Node.js ever regresses.
      - name: Check npm version
        run: test "$(printf '%s\n11.5.1\n' "$(npm -v)" | sort -V | head -1)" = "11.5.1"
      # Only a tag that release-it created names the version in package.json; anything else is refused before npm ci.
      - name: Check that the tag matches the package version
        run: |
          version="$(npm pkg get version | tr -d '"')"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi
      - run: npm ci
      # `prepack` builds the package. Trusted publishing (OIDC) authenticates and attaches provenance; no npm token.
      # A version that is already on the registry is skipped, so a failed run can be re-run without a 403.
      - name: Publish to npm
        run: |
          name="$(npm pkg get name | tr -d '"')"
          version="$(npm pkg get version | tr -d '"')"
          if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "${version}" ]; then
            echo "${name}@${version} is already on the registry; nothing to publish."
          else
            npm publish
          fi
      # release-it in "update or re-run" mode (--no-increment): the release notes for this tag come from the
      # conventional commits. A release that already exists for this tag is left alone, so a re-run cannot fail on it.
      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists; nothing to do."
          else
            npx release-it --ci --no-increment --no-git --no-npm --no-hooks --github.release \
              --no-plugins.@release-it/conventional-changelog.infile
          fi
