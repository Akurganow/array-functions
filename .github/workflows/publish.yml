name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (bundled with Node.js >= 22.14); fail loudly if the pinned Node.js ever regresses.
      - name: Check npm version
        run: test "$(printf '%s\n11.5.1\n' "$(npm -v)" | sort -V | head -1)" = "11.5.1"
      - run: npm ci
      # The build itself runs in `prepack` as part of `npm publish`.
      - run: npx biome ci --error-on-warnings . && npm run typecheck && npm test
      - name: Publish with provenance
        run: npm publish --provenance --access public
