version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release before proposing it.
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        # Biome and TypeScript change lint/format results and the emitted types; review them one at a time.
        exclude-patterns: ["@biomejs/biome", "typescript"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
